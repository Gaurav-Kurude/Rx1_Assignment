
<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
</head>
<body>

    <h2>Add Task</h2>

    <input
        type="text"
        id="taskTitle"
        placeholder="Task Title"
    />

    <input
        type="text"
        id="taskDescription"
        placeholder="Task Description"
    />

    <button id="addTaskBtn">Add Task</button>

    <h2>Remove Task</h2>

    <input
        type="number"
        id="taskId"
        placeholder="Task ID"
    />

    <button id="removeTaskBtn">Remove Task</button>

    <ul id="taskList"></ul>

    <p id="totalTasks">Total Tasks: 0</p>

    <script type="module" src="./index.js"></script>

</body>
</html>
